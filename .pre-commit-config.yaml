repos:
  - repo: https://github.com/avishek-sen-gupta/python-fp-lint
    rev: 7ed06f37912919a0e4c98502b4df36a1b782a6ec
    hooks:
      - id: python-fp-lint
        args: [--config, fp.json]
        # Manual-only for now: this hook blocks on 185 pre-existing violations
        # (94 in interpreter/cobol/condition_lowering.py, 91 in
        # tests/integration/test_cobol_programs.py — mostly no-is-not-none,
        # reassignment and no-deep-nesting). It landed in f927ec5e, whose own
        # commit staged only YAML, so it passed trivially there and blocked the
        # next Python commit instead. The sibling local hook below is already
        # advisory (`|| true`, interpreter/ only); this keeps the strict rules
        # available on demand without gating every commit:
        #     uv run pre-commit run --hook-stage manual python-fp-lint --all-files
        stages: [manual]
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        types: [text]

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

      - id: black
        name: Black (auto-fix)
        # Formats and re-stages ONLY the files pre-commit hands us, which are the
        # staged ones. It used to run `black .` then `git add -u`, and `git add -u`
        # stages EVERY modified tracked file — so any edit in flight elsewhere in
        # the tree was swept into whatever commit happened to be running. That
        # mis-attributed a COBOL fix to a lint-config commit (f9142a4b/9f14b79f)
        # and, in red-dragon-forge, bundled an unrelated reformat into a docs
        # commit. Passing filenames also means black no longer walks the whole
        # tree on every commit.
        entry: bash -c 'uv run python -m black "$@" && git add -- "$@"' --
        language: system
        types: [python]

      - id: python-fp-lint
        name: Python FP lint (warnings only)
        entry: bash -c 'uv run python -m python_fp_lint check interpreter/ || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Pyright type check (warnings only)
        entry: bash -c 'uv run pyright || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: import-linter architectural contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: Full test suite (slow — several minutes; CICS/CardDemo e2e moved to cicada)
        # `make test` builds the ProLeap bridge JAR if missing, then runs the
        # full interpreter/ + tests/ suite. No CardDemo/CICS toolchain wiring
        # here anymore — that runtime and its e2e tests moved to the cicada
        # repo (see 975277bf). This hook alone can take several minutes; give
        # it a long timeout (or run in the background) rather than assuming a
        # hang.
        entry: make test PYTEST_ARGS="-x -q"
        language: system
        pass_filenames: false
        always_run: true

      # Temporarily disabled — these hooks rewrite tracked files (the gaps-doc
      # datestamp / issues.jsonl) during pre-commit, which intermittently aborts
      # commits. Re-enable once they no longer mutate the tree mid-commit.
      # - id: feature-coverage-gaps
      #   name: Regenerate frontend lowering gaps doc
      #   entry: bash -c 'uv run python scripts/feature_coverage_audit.py --gaps-doc docs/frontend-lowering-gaps.md && git add -u docs/frontend-lowering-gaps.md'
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      # - id: beads-backup
      #   name: Beads backup
      #   entry: bash -c 'command -v bd >/dev/null 2>&1 && bd export --all -o ./issues/issues.jsonl || true'
      #   language: system
      #   pass_filenames: false
      #   always_run: true
